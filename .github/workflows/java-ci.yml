name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile application and tests
        run: |
          mkdir -p bin
          javac -encoding UTF-8 -d bin -sourcepath src src/Application.java tests/BankingSystemTests.java

      - name: Run core banking tests
        run: java -ea -cp bin BankingSystemTests
